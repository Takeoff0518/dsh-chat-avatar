<!doctype html>
<html lang="zh">
	<head>
		<meta charset="utf-8" />
		<title>avatar contact sheet</title>
		<style>
			body {
				margin: 0;
				padding: 24px 32px;
				background: #fff;
				font: 14px/22px -apple-system, "Segoe UI", system-ui, sans-serif;
				color: #1c1c1e;
			}
			.row {
				display: flex;
				align-items: center;
				gap: 24px;
				padding: 8px 0;
			}
			.cell {
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.label {
				font-size: 11px;
				color: #6b7280;
				width: 40px;
			}
		</style>
	</head>
	<body>
		<div id="sheet"></div>
		<script>
			/* Reuse the plugin's own default artwork and clip rules. */
			const svgUser =
				'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
				'<defs><linearGradient id="u" x1="0" y1="0" x2="0" y2="1">' +
				'<stop offset="0" stop-color="#9fb2d2"/><stop offset="1" stop-color="#6a80a6"/>' +
				"</linearGradient></defs>" +
				'<rect width="64" height="64" fill="url(#u)"/>' +
				'<circle cx="32" cy="24" r="10.5" fill="#ffffff"/>' +
				'<path d="M32 38c10.2 0 17 6.2 17 14.6V64H15V52.6C15 44.2 21.8 38 32 38z" fill="#ffffff"/>' +
				"</svg>";
			const svgAi =
				'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
				'<defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1">' +
				'<stop offset="0" stop-color="#5b7bff"/><stop offset="1" stop-color="#2236b8"/>' +
				"</linearGradient></defs>" +
				'<rect width="64" height="64" fill="url(#a)"/>' +
				'<path d="M31 12l4.9 12.1L48 29l-12.1 4.9L31 46l-4.9-12.1L14 29l12.1-4.9z" fill="#ffffff"/>' +
				'<circle cx="46" cy="17" r="3.2" fill="#ffffff" fill-opacity="0.78"/>' +
				"</svg>";
			const url = (svg) => 'url("data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) + '")';
			const sheet = document.getElementById("sheet");
			for (const size of [24, 32, 40, 56]) {
				const row = document.createElement("div");
				row.className = "row";
				for (const [label, svg] of [
					["user", svgUser],
					["ai", svgAi],
				]) {
					const cell = document.createElement("div");
					cell.className = "cell";
					const tag = document.createElement("span");
					tag.className = "label";
					tag.textContent = label + " " + size;
					const disc = document.createElement("span");
					disc.style.cssText =
						"display:inline-block;width:" +
						size +
						"px;height:" +
						size +
						"px;border-radius:50%;clip-path:circle(50% at 50% 50%);background-color:#f4f4f5;background-image:" +
						url(svg) +
						";background-position:center;background-size:cover;background-repeat:no-repeat;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)";
					cell.append(tag, disc);
					row.append(cell);
				}
				sheet.append(row);
			}
		</script>
	</body>
</html>
